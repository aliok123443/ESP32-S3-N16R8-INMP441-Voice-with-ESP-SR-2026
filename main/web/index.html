<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0e1a">
  <title>Voice Lights</title>
  <style>
    :root {
      color-scheme: dark;
      --accent: #7c5cff;
      --accent-2: #22c1e0;
      --ok: #4be08a;
      --warn: #f5a623;
      --bad: #ff6b81;
      --panel: rgba(22, 26, 46, .82);
      --muted: #9aa2c4;
      --line: rgba(255, 255, 255, .10);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f5f6ff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, #3a266e55 0, transparent 35%),
        radial-gradient(circle at 90% 85%, #073f6155 0, transparent 40%),
        #0b0e1a;
      overflow-x: hidden;
    }

    main {
      width: min(100%, 480px);
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 30px 90px #0009, inset 0 1px 0 #ffffff0d;
      backdrop-filter: blur(18px);
      position: relative;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 28px;
    }
    h1 {
      margin: 0;
      font-size: 1.55rem;
      letter-spacing: -.03em;
      background: linear-gradient(135deg, #fff, #c9c2ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .sub { color: var(--muted); margin: 6px 0 0; font-size: .86rem; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #ffffff0e;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: .76rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 999px;
      background: var(--warn);
      box-shadow: 0 0 10px currentColor;
      flex-shrink: 0;
    }
    .badge.online .dot { background: var(--ok); color: var(--ok); }
    .badge.listening .dot { background: var(--accent-2); color: var(--accent-2); animation: pulse 1.1s infinite; }
    @keyframes pulse { 50% { opacity: .25; transform: scale(.65); } }

    .status-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }

    .relay-card {
      display: grid;
      justify-items: center;
      gap: 22px;
      padding: 34px 20px 30px;
      border-radius: 24px;
      background: linear-gradient(160deg, #ffffff0f, #00000022);
      border: 1px solid var(--line);
    }

    .relay-label { color: var(--muted); font-size: .82rem; text-transform: uppercase; letter-spacing: .12em; }

    .switch {
      --w: 128px; --h: 68px; --pad: 6px;
      width: var(--w);
      height: var(--h);
      border-radius: var(--h);
      border: none;
      cursor: pointer;
      position: relative;
      padding: 0;
      background: linear-gradient(180deg, #2a2f4c, #1b1f36);
      box-shadow: inset 0 2px 8px #00000066, 0 6px 24px #00000040;
      transition: background .35s ease;
    }
    .switch.on {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: inset 0 2px 8px #ffffff33, 0 8px 30px #7c5cff55;
    }
    .switch .knob {
      position: absolute;
      top: var(--pad);
      left: var(--pad);
      width: calc(var(--h) - var(--pad) * 2);
      height: calc(var(--h) - var(--pad) * 2);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff, #d8d9ea);
      box-shadow: 0 4px 10px #00000055;
      transition: transform .35s cubic-bezier(.34,1.56,.64,1);
    }
    .switch.on .knob { transform: translateX(calc(var(--w) - var(--h))); }
    .switch:active .knob { filter: brightness(.95); }

    .relay-state {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: .02em;
    }
    .relay-state.on { color: var(--ok); }
    .relay-state.off { color: var(--muted); }

    .hint {
      margin-top: 8px;
      text-align: center;
      color: var(--muted);
      font-size: .8rem;
    }

    .voice {
      margin-top: 22px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #070a1580;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .voice .icon {
      flex-shrink: 0;
      width: 34px; height: 34px;
      border-radius: 10px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font-size: 1rem;
    }
    .voice strong { display: block; margin-bottom: 4px; font-size: .92rem; }
    .voice p { color: var(--muted); font-size: .84rem; line-height: 1.5; margin: 0; }
    .voice p.error { color: var(--bad); }
    kbd {
      padding: 2px 7px;
      border-radius: 6px;
      color: #e9e3ff;
      background: #ffffff14;
      border: 1px solid var(--line);
      font-family: ui-monospace, monospace;
      font-size: .82em;
    }

    footer {
      margin-top: 20px;
      text-align: center;
      color: #5c628a;
      font-size: .72rem;
      letter-spacing: .04em;
    }

    @media (max-width: 420px) {
      main { padding: 22px; border-radius: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Voice Lights</h1>
        <p class="sub">YD-ESP32-S3 · offline ESP-SR</p>
      </div>
    </header>

    <div class="status-row">
      <span id="network" class="badge"><i class="dot"></i><span>Подключение…</span></span>
      <span id="listen" class="badge"><i class="dot"></i><span>Прослушивание</span></span>
    </div>

    <section class="relay-card">
      <span class="relay-label">Освещение</span>
      <button id="relay" class="switch" type="button" aria-pressed="false" aria-label="Переключить освещение">
        <span class="knob"></span>
      </button>
      <span id="relay-text" class="relay-state off">ВЫКЛЮЧЕНО</span>
    </section>

    <section class="voice">
      <span class="icon">🎙️</span>
      <div>
        <strong>Голосовое управление</strong>
        <p id="voice-text">Скажите <kbd>lights</kbd> дважды подряд в течение 2 секунд, чтобы переключить освещение.</p>
      </div>
    </section>

    <footer>обновление статуса каждые 2.5 с</footer>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const relayBtn = $('relay');
    const relayText = $('relay-text');
    const networkBadge = $('network');
    const listenBadge = $('listen');
    const voiceText = $('voice-text');

    let busy = false;

    function paintRelay(on) {
      relayBtn.classList.toggle('on', on);
      relayBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      relayText.textContent = on ? 'ВКЛЮЧЕНО' : 'ВЫКЛЮЧЕНО';
      relayText.className = 'relay-state ' + (on ? 'on' : 'off');
    }

    function paintNetwork(wifi) {
      networkBadge.className = 'badge' + (wifi ? ' online' : '');
      networkBadge.querySelector('span').textContent = wifi ? 'Wi-Fi подключен' : 'Точка настройки';
    }

    function paintListening(listening) {
      listenBadge.className = 'badge' + (listening ? ' listening' : '');
      listenBadge.querySelector('span').textContent = listening ? 'Слушает' : 'Ожидание';
    }

    async function post(url, data) {
      const response = await fetch(url, {
        method: 'POST',
        headers: data ? { 'Content-Type': 'application/json' } : undefined,
        body: data ? JSON.stringify(data) : undefined,
      });
      if (!response.ok) throw new Error('request failed');
      return response.json();
    }

    async function sync() {
      try {
        const response = await fetch('/api/state');
        if (!response.ok) throw new Error('bad status');
        const state = await response.json();
        paintRelay(state.relay);
        paintNetwork(state.wifi);
        paintListening(state.listening);
        voiceText.className = '';
        voiceText.textContent = 'Скажите "lights" дважды подряд в течение 2 секунд, чтобы переключить освещение.';
      } catch (err) {
        voiceText.textContent = 'Связь с устройством потеряна. Подключитесь к сети настройки и обновите страницу.';
        voiceText.className = 'error';
      }
    }

    relayBtn.addEventListener('click', async () => {
      if (busy) return;
      busy = true;
      relayBtn.disabled = true;
      // optimistic UI update
      paintRelay(!relayBtn.classList.contains('on'));
      try {
        const state = await post('/api/relay');
        paintRelay(state.relay);
        paintNetwork(state.wifi);
        paintListening(state.listening);
      } catch (err) {
        await sync();
      } finally {
        busy = false;
        relayBtn.disabled = false;
      }
    });

    sync();
    setInterval(sync, 2500);
  </script>
</body>
</html>
